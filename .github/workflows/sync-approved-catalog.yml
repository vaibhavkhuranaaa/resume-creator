name: Synchronize verified portfolio catalog

on:
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resume-catalog-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Import the deployed approved catalog
        run: npm run catalog:sync -- https://portfolio-reeper1.vercel.app/data/approved-projects.json
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit synchronized catalog
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add src/data/approved-projects.json
          if git diff --cached --quiet; then
            echo "Résumé catalog is already current."
          else
            git commit -m "chore: synchronize verified portfolio catalog"
            git push
          fi
